[package]
name = "uv-migrator"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Cross-platform CLI and GUI to discover, scan, and safely migrate Python virtual environments to uv"

[lib]
name = "uv_migrator"
path = "src/lib.rs"

[[bin]]
name = "uv-migrator"
path = "src/main.rs"

[[bin]]
name = "uv-migrator-gui"
path = "src/gui_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
colored = "3.1"
indicatif = "0.18"
inquire = "0.9"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
globset = "0.4"
which = "8.0"
regex = "1.11"
directories = "6.0"
sysinfo = "0.33"
rayon = "1.10"
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"

